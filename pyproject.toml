[project]
name = "kdd-agent"
version = "5.0.0"
description = "KDD Cup 2026 Data Agent v5"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
